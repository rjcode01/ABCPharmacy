<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ABC Pharmacy</title>
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>ABC Pharmacy</h1>
        <p>Medicine & sales management</p>
      </div>
      <nav>
        <button class="nav-btn active" data-view="medicines">Medicines</button
        ><button class="nav-btn" data-view="sales">Sales Records</button>
      </nav>
    </header>
    <main>
      <section id="medicinesView" class="view">
        <div class="toolbar">
          <input id="search" placeholder="Search medicine name..." /><button
            id="addBtn"
          >
            + Add Medicine</button
          ><button id="refreshBtn" class="secondary">Refresh</button>
        </div>
        <div class="legend">
          <span class="red-dot"></span> Expiry within 30 days
          <span class="yellow-dot"></span> Stock below 10
        </div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Medicine</th>
                <th>Expiry Date</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Brand</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="medicineRows"></tbody>
          </table>
        </div>
      </section>
      <section id="salesView" class="view hidden">
        <div class="toolbar">
          <h2>Sale Records</h2>
          <button id="salesRefresh" class="secondary">Refresh</button>
        </div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Medicine</th>
                <th>Quantity Sold</th>
                <th>Unit Price</th>
                <th>Total</th>
                <th>Sold At</th>
              </tr>
            </thead>
            <tbody id="salesRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button class="close" id="closeModal">×</button>
        <h2>Add Medicine</h2>
        <form id="medicineForm">
          <label>Full Name<input name="fullName" required /></label
          ><label>Notes<textarea name="notes"></textarea></label>
          <div class="two">
            <label
              >Expiry Date<input
                type="date"
                name="expiryDate"
                required /></label
            ><label
              >Quantity<input type="number" name="quantity" min="0" required
            /></label>
          </div>
          <div class="two">
            <label
              >Price<input
                type="number"
                name="price"
                min="0"
                step="0.01"
                required /></label
            ><label>Brand<input name="brand" required /></label>
          </div>
          <button type="submit">Save Medicine</button>
        </form>
      </div>
    </div>
    <div id="saleModal" class="modal hidden">
      <div class="modal-card">
        <button class="close" id="closeSale">×</button>
        <h2>Record Sale</h2>
        <form id="saleForm">
          <input type="hidden" name="medicineId" />
          <p id="saleMedicine"></p>
          <label
            >Quantity Sold<input
              name="quantitySold"
              type="number"
              min="1"
              required /></label
          ><button type="submit">Complete Sale</button>
        </form>
      </div>
    </div>
    <div id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
